[pytest]
# Ohne testpaths sammelt ein nacktes `pytest` auch Snapshot-Baeume unter
# _preview/ oder .claude/worktrees/ ein und bricht beim Import ab.
testpaths = tests
norecursedirs = _preview artifacts tmp test-results node_modules venv .claude .git
markers =
    source_contract: source-level contract check that does not execute browser behavior
