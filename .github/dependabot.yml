# Monthly and quiet: at most one dependency PR per ecosystem a month. Minor and
# patch updates arrive as one grouped PR; major version updates are not proposed
# at all (each needs its own deliberate migration, and one PR per major flooded
# the inbox). Security advisories still surface: pip-audit runs nightly in
# tests.yml, and a security fix nearly always ships as a patch on the current
# major. Python: requirements.txt is generated by pip-compile from
# requirements.in, and Dependabot regenerates it the same way. An npm update that
# touches esbuild or a vendored library (marked, DOMPurify, KaTeX) fails
# build:check until someone runs npm run build on the PR branch; that is
# intended. Details: docs/testing.md.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
      time: "06:00"
      timezone: Europe/Berlin
    commit-message:
      prefix: chore
      include: scope
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      python-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
      time: "06:00"
      timezone: Europe/Berlin
    commit-message:
      prefix: chore
      include: scope
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      npm-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  # Actions majors stay in: runner deprecations (Node 20) arrive as majors, and
  # all actions travel in one PR.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: "06:00"
      timezone: Europe/Berlin
    commit-message:
      prefix: chore
      include: scope
    groups:
      github-actions:
        patterns: ["*"]
