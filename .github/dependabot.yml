# Weekly dependency PRs. Minor and patch updates arrive as one grouped PR per
# ecosystem; major updates come one by one, because they need their own review.
# Python: requirements.txt is generated by pip-compile from requirements.in, and
# Dependabot regenerates it the same way. An npm update that touches esbuild or
# a vendored library (marked, DOMPurify, KaTeX) fails build:check until someone
# runs npm run build on the PR branch; that is intended. Details: docs/testing.md.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    commit-message:
      prefix: chore
      include: scope
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    commit-message:
      prefix: chore
      include: scope
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    commit-message:
      prefix: chore
      include: scope
    groups:
      github-actions:
        patterns: ["*"]
