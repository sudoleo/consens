name: Regression tests

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '*.md'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - 'docs/**'
      - '*.md'
  workflow_dispatch:
    inputs:
      suite:
        description: Checks to run (full includes browser/emulator and Windows)
        type: choice
        required: true
        default: quick
        options:
          - quick
          - backend
          - frontend
          - browser-and-rules
          - windows-entry-points
          - full

permissions:
  contents: read

concurrency:
  # A quick push must not cancel an explicitly requested full/individual run.
  group: regression-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && inputs.suite || github.event.action == 'ready_for_review' && 'full' || 'quick' }}
  cancel-in-progress: true

jobs:
  backend:
    if: github.event_name != 'workflow_dispatch' || inputs.suite == 'quick' || inputs.suite == 'backend' || inputs.suite == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      UNIT_TEST_MODE: "1"
      PYTHONUTF8: "1"
      OPENROUTER_API_KEY: ci-dummy-key
    steps:
      - uses: actions/checkout@v4
        with:
          # Cache-key contracts compare each asset with its actual change date.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt
      - run: python -m pip install -r requirements-test.txt
      - name: All backend regressions (empty discovery fails)
        run: python -m pytest tests -q --junitxml=test-results/backend.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-results
          path: test-results/
          if-no-files-found: error

  frontend:
    if: github.event_name != 'workflow_dispatch' || inputs.suite == 'quick' || inputs.suite == 'frontend' || inputs.suite == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm test -- --reporter=default --reporter=junit --outputFile=test-results/frontend.xml
      - run: npm run build:check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-results
          path: test-results/
          if-no-files-found: error

  browser-and-rules:
    if: github.event.action == 'ready_for_review' || (github.event_name == 'workflow_dispatch' && (inputs.suite == 'browser-and-rules' || inputs.suite == 'full'))
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      RUN_E2E: "1"
      E2E_TEST_MODE: "1"
      PYTHONUTF8: "1"
      OPENROUTER_API_KEY: ci-dummy-key
      GOOGLE_CLOUD_PROJECT: demo-consensio-e2e
      GCLOUD_PROJECT: demo-consensio-e2e
      FIREBASE_PROJECT_ID: demo-consensio-e2e
      FIRESTORE_EMULATOR_HOST: 127.0.0.1:8085
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt
            requirements-e2e.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: python -m pip install -r requirements-e2e.txt
      - run: python -m playwright install --with-deps chromium
      - run: npm ci
      - run: npm install --global firebase-tools@13.35.1
      - run: npm run build:check
      - name: Client rules, native transactions and Chromium
        run: >-
          firebase emulators:exec --only firestore --project demo-consensio-e2e --config firebase.json --non-interactive
          "npm run test:rules && python -m pytest tests/e2e -q --junitxml=test-results/browser.xml"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-emulator-results
          path: |
            test-results/
            *-debug.log
            artifacts/source-verification-ui/
          if-no-files-found: error

  windows-entry-points:
    if: github.event.action == 'ready_for_review' || (github.event_name == 'workflow_dispatch' && (inputs.suite == 'windows-entry-points' || inputs.suite == 'full'))
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
      OPENROUTER_API_KEY: ci-dummy-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt
            requirements-e2e.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: python -m venv venv
      - run: venv/Scripts/python.exe -m pip install -r requirements-e2e.txt
      - run: venv/Scripts/python.exe -m playwright install chromium
      - run: npm ci
      - run: npm install --global firebase-tools@13.35.1
      - name: Both PowerShell versions and failure/environment contracts
        run: venv/Scripts/python.exe -m pytest tests/test_dev_cli.py -q --junitxml=test-results/windows-cli.xml
      - run: .\dev.ps1 check backend -TestPath tests/test_request_body_limits.py
      - run: .\dev.ps1 check frontend -TestPath tests/js/stored-turn-markers.test.mjs
      - run: .\dev.ps1 check rules
      - run: .\dev.ps1 check browser -TestPath tests/e2e/test_phase2_transactions.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-results
          path: |
            test-results/
            *-debug.log
          if-no-files-found: error
