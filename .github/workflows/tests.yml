name: Regression tests

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '*.md'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - 'docs/**'
      - '*.md'
  schedule:
    # Nightly on main: browser/emulator suite and the dependency audit, so both
    # run without a ready-for-review PR. Off the full hour, when GitHub delays
    # scheduled runs the most.
    - cron: '17 2 * * *'
  workflow_dispatch:
    inputs:
      suite:
        description: Checks to run (full includes browser/emulator and Windows)
        type: choice
        required: true
        default: quick
        options:
          - quick
          - backend
          - frontend
          - browser-and-rules
          - windows-entry-points
          - dependency-audit
          - full

permissions:
  contents: read

concurrency:
  # A quick push must not cancel an explicitly requested full/individual run,
  # and a push to main must not cancel the nightly run (or the other way round).
  group: regression-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && inputs.suite || github.event_name == 'schedule' && 'nightly' || github.event.action == 'ready_for_review' && 'full' || 'quick' }}
  cancel-in-progress: true

jobs:
  backend:
    if: github.event_name != 'schedule' && (github.event_name != 'workflow_dispatch' || inputs.suite == 'quick' || inputs.suite == 'backend' || inputs.suite == 'full')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      UNIT_TEST_MODE: "1"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          # Cache-key contracts compare each asset with its actual change date.
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt
      - run: python -m pip install -r requirements-test.txt
      - name: All backend regressions (empty discovery fails)
        run: python -m pytest tests -q --junitxml=test-results/backend.xml
      # Job logs need a GitHub login; annotations do not. Failed tests show up
      # there, so a failure can be read (and fixed) without signing in.
      - name: Failed tests as annotations
        if: failure()
        run: |
          python - <<'EOF'
          import xml.etree.ElementTree as ET
          for case in ET.parse("test-results/backend.xml").iter("testcase"):
              for problem in [*case.iter("failure"), *case.iter("error")]:
                  text = (problem.get("message") or "") + "\n" + (problem.text or "")[-1500:]
                  text = text.replace("%", "%25").replace("\r", "").replace("\n", "%0A")
                  print(f"::error title={case.get('classname')}::{case.get('name')}%0A{text}")
          EOF
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: backend-results
          path: test-results/
          if-no-files-found: error

  frontend:
    if: github.event_name != 'schedule' && (github.event_name != 'workflow_dispatch' || inputs.suite == 'quick' || inputs.suite == 'frontend' || inputs.suite == 'full')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm test -- --reporter=default --reporter=junit --outputFile=test-results/frontend.xml
      - run: npm run build:check
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: frontend-results
          path: test-results/
          if-no-files-found: error

  browser-and-rules:
    if: github.event_name == 'schedule' || github.event.action == 'ready_for_review' || (github.event_name == 'workflow_dispatch' && (inputs.suite == 'browser-and-rules' || inputs.suite == 'full'))
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      RUN_E2E: "1"
      E2E_TEST_MODE: "1"
      PYTHONUTF8: "1"
      OPENROUTER_API_KEY: ci-dummy-key
      GOOGLE_CLOUD_PROJECT: demo-consensio-e2e
      GCLOUD_PROJECT: demo-consensio-e2e
      FIREBASE_PROJECT_ID: demo-consensio-e2e
      FIRESTORE_EMULATOR_HOST: 127.0.0.1:8085
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt
            requirements-e2e.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - run: python -m pip install -r requirements-e2e.txt
      - run: python -m playwright install --with-deps chromium
      - run: npm ci
      - run: npm install --global firebase-tools@13.35.1
      - run: npm run build:check
      - name: Client rules, native transactions and Chromium
        run: >-
          firebase emulators:exec --only firestore --project demo-consensio-e2e --config firebase.json --non-interactive
          "npm run test:rules && python -m pytest tests/e2e -q --junitxml=test-results/browser.xml"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: browser-emulator-results
          path: |
            test-results/
            *-debug.log
            artifacts/source-verification-ui/
          if-no-files-found: error

  dependency-audit:
    # Own job: a newly published advisory turns this red without hiding whether
    # the tests pass. Also nightly, so advisories surface without a push.
    if: github.event_name != 'workflow_dispatch' || inputs.suite == 'quick' || inputs.suite == 'dependency-audit' || inputs.suite == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - run: python -m pip install "pip-audit>=2.10,<3"
      - name: Production dependencies (fully pinned by pip-compile)
        run: python -m pip_audit --strict --no-deps -r requirements.txt
      - name: Test and browser dependencies (resolved)
        run: python -m pip_audit --strict -r requirements-e2e.txt

  windows-entry-points:
    if: github.event.action == 'ready_for_review' || (github.event_name == 'workflow_dispatch' && (inputs.suite == 'windows-entry-points' || inputs.suite == 'full'))
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
      OPENROUTER_API_KEY: ci-dummy-key
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt
            requirements-e2e.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - run: python -m venv venv
      - run: venv/Scripts/python.exe -m pip install -r requirements-e2e.txt
      - run: venv/Scripts/python.exe -m playwright install chromium
      - run: npm ci
      - run: npm install --global firebase-tools@13.35.1
      - name: Both PowerShell versions and failure/environment contracts
        run: venv/Scripts/python.exe -m pytest tests/test_dev_cli.py -q --junitxml=test-results/windows-cli.xml
      - run: .\dev.ps1 check backend -TestPath tests/test_request_body_limits.py
      - run: .\dev.ps1 check frontend -TestPath tests/js/stored-turn-markers.test.mjs
      - run: .\dev.ps1 check rules
      - run: .\dev.ps1 check browser -TestPath tests/e2e/test_phase2_transactions.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-results
          path: |
            test-results/
            *-debug.log
          if-no-files-found: error
