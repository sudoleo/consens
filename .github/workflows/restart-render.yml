name: Restart Render Service Daily

on:
  workflow_dispatch:
  schedule:
    # 22:00 UTC = 00:00 MESZ (Sommerzeit) bzw. 23:00 MEZ (Winterzeit, ab 25.10.).
    # GitHub startet geplante Läufe oft verspätet, manchmal um Stunden.
    - cron: '0 22 * * *'

# The job only calls the Render API with its own secrets; it needs no repo token.
permissions: {}

jobs:
  restart:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger Render Restart
        run: |
          curl --fail-with-body --silent --show-error \
            --connect-timeout 10 --max-time 60 \
            --retry 3 --retry-delay 2 --retry-all-errors \
            --request POST \
            --url "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/restart" \
            --header "Accept: application/json" \
            --header "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}"
