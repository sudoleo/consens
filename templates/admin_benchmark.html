<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Benchmark Runs | consens.io</title>
    <meta id="adminBootstrapConfig"
          data-firebase-api-key="{{ firebase_api_key | e }}"
          data-firebase-auth-domain="{{ firebase_auth_domain | e }}"
          data-firebase-project-id="{{ firebase_project_id | e }}"
          data-firebase-storage-bucket="{{ firebase_storage_bucket | e }}"
          data-firebase-messaging-sender-id="{{ firebase_messaging_sender_id | e }}"
          data-firebase-app-id="{{ firebase_app_id | e }}">
    <script src="{{ asset_url('/static/js/admin-config.js') }}"></script>
    <link rel="stylesheet" href="{{ asset_url('/static/style.css') }}">
    <link rel="stylesheet" href="{{ asset_url('/static/css/admin-benchmark.css') }}">
    <script type="module" src="{{ asset_url('/static/js/admin-benchmark.js') }}"></script>
</head>
<body class="dark-mode">
    <header class="top-bar">
        <div class="top-bar-logo">
            <a href="/" id="logoLink"><img src="/static/favicon.png" alt="Favicon" class="top-bar-favicon"></a>
            <span class="top-bar-title">consens.io Benchmark</span>
        </div>
        <div class="top-bar-right">
            <a href="/admin" class="top-bar-about">Admin</a>
            <a href="/app" class="top-bar-about">Back to App</a>
        </div>
    </header>

    <main class="bm-container">
        <div class="bm-toolbar">
            <label for="runSelect" class="bm-run-label">Run:</label>
            <select id="runSelect"></select>
            <button id="refreshBtn" class="admin-btn" type="button">Refresh</button>
            <span id="bmStatus" class="bm-status" role="status"></span>
        </div>
        <div id="runDetail"></div>
    </main>
</body>
</html>
